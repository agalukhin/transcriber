# Локальный транскрибатор — настройки воркера. Пути с ~ разворачиваются.
vault_root: ~/Documents/Obsidian Vault/Вольт воркфлоу
min_silence_ms: 700
max_utterance_s: 30
speaker_similarity: 0.3
echo_overlap: 0.8
echo_similarity: 0.6
echo_strong_similarity: 0.8
keep_audio: false
