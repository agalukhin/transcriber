# Локальный транскрибатор — настройки воркера. Пути с ~ разворачиваются.
vault_root: ~/Documents/Obsidian Vault/Вольт воркфлоу
# Приватные записи (в meta.json стоит private: true) идут сюда, а не в вольт: ни транскрипта,
# ни заметки, ни голоса в библиотеке. Каталог и файлы — только для владельца (0700/0600).
private_dir: ~/Documents/Приватные записи
min_silence_ms: 700
max_utterance_s: 30
# Блоки: реплики склеиваются и уходят в whisper пачкой — точнее, чем по одной фразе.
block_min_s: 45          # минимум блока: короче в модель не отправляем
block_max_s: 90          # максимум: дальше режем на границе реплики, чтобы текст не ждал
block_gap_s: 1.5         # пауза, по которой блок закрывается после набранного минимума
block_gap_keep_s: 0.5    # столько тишины оставляем в склейке вместо реальной паузы
block_idle_s: 4          # тишины после последней реплики — закрываем блок, не ждём продолжения
carry_context: true      # хвост прошлого блока канала уходит в промпт следующего
speaker_similarity: 0.3
# Голосовые профили: библиотека в ~/Claude/transcriber/voices, пополняется через transcriber learn.
voice_match_similarity: 0.6   # ниже — кластер остаётся «Speaker N»; поднять, если имена липнут не к тем
voice_min_samples: 3           # кластер короче именем не подписываем
echo_overlap: 0.8
echo_similarity: 0.6
echo_strong_similarity: 0.8
# Подавление эха по звуку: из микрофона вычитается то, что в это время играло в динамиках.
# Текстовый фильтр выше остаётся вторым рубежом. Проверено на стенде по трём записям.
echo_suppress: true
echo_beta: 2.0           # запас на недооценку тракта; ниже 1.5 эхо остаётся слышным для VAD
echo_floor: 0.05         # глубже корзину не давим — останется дыра вместо звука
# на период настройки; выключить, когда качество устроит
keep_audio: true
# Фразы, которые whisper галлюцинирует на тишине; вырезаются из текста.
hallucinations:
  - Субтитры сделал DimaTorzok
  - Субтитры создавал DimaTorzok
  - Редактор субтитров А.Семкин
  - Корректор А.Егорова
  - Продолжение следует
  - Спасибо за просмотр
